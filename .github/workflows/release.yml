name: Release

# Triggers on a version tag like v0.1.0. Builds + uploads signed artifacts to
# GitHub Releases. Store submission (TestFlight / Play Internal) is gated
# behind explicit `if: ${{ secrets.* }}` so the workflow still works on forks
# without secrets.
#
# ─── DISABLED ─────────────────────────────────────────────────────────────
# Auto-trigger on tag push is commented out per Stage-2.5 hold. Only manual
# runs via the "Run workflow" button fire. Re-enable by uncommenting the
# `push:` block below.
# ──────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  # push:
  #   tags:
  #     - "v*"

permissions:
  contents: write

jobs:
  ios-release:
    name: iOS Release (signed IPA)
    runs-on: macos-14
    if: ${{ vars.RELEASE_IOS == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen + librsvg
        run: brew install xcodegen librsvg

      - name: Install Rust + iOS targets
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Import signing certificate
        env:
          P12: ${{ secrets.APPLE_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 -d \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/AsItSounds.mobileprovision"

      - name: Fetch deps
        run: |
          git clone --depth 1 --branch v1.7.5 \
            https://github.com/ggerganov/whisper.cpp core/third_party/whisper.cpp
          git clone --depth 1 --branch v6.29.3 \
            https://github.com/groue/GRDB.swift ios/packages/GRDB

      - name: Build Rust core for iOS
        run: |
          source "$HOME/.cargo/env"
          cd core && ./scripts/build-ios.sh

      - name: Build whisper.xcframework
        run: |
          (cd core/third_party/whisper.cpp && ./build-xcframework.sh) || true
          (cd core && ./scripts/assemble-whisper-xcframework.sh)

      - name: Archive + export
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          cd ios
          xcodegen generate
          xcodebuild -project AsItSounds.xcodeproj \
            -scheme AsItSounds \
            -configuration Release \
            -archivePath build/AsItSounds.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive
          xcodebuild -exportArchive \
            -archivePath build/AsItSounds.xcarchive \
            -exportOptionsPlist ../.doc/export-options.plist \
            -exportPath build/export

      - name: Upload IPA to release
        uses: softprops/action-gh-release@v2
        with:
          files: ios/build/export/*.ipa

  android-release:
    name: Android Release (signed AAB)
    runs-on: ubuntu-22.04
    if: ${{ vars.RELEASE_ANDROID == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode upload keystore
        env:
          KS_B64: ${{ secrets.AIS_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "AIS_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Install Rust + cargo-ndk
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi \
                           x86_64-linux-android i686-linux-android
          cargo install --locked cargo-ndk

      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018
            cmake;3.22.1

      - name: Export NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fetch whisper.cpp
        run: |
          git clone --depth 1 --branch v1.7.5 \
            https://github.com/ggerganov/whisper.cpp core/third_party/whisper.cpp

      - name: Build Rust core for Android
        run: |
          source "$HOME/.cargo/env"
          cd core && ./scripts/build-android.sh

      - name: Build release AAB
        env:
          AIS_UPLOAD_STORE_PASSWORD: ${{ secrets.AIS_UPLOAD_STORE_PASSWORD }}
          AIS_UPLOAD_KEY_ALIAS:      ${{ secrets.AIS_UPLOAD_KEY_ALIAS }}
          AIS_UPLOAD_KEY_PASSWORD:   ${{ secrets.AIS_UPLOAD_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease \
            -PAIS_UPLOAD_STORE_FILE="$AIS_UPLOAD_STORE_FILE" \
            -PAIS_UPLOAD_STORE_PASSWORD="$AIS_UPLOAD_STORE_PASSWORD" \
            -PAIS_UPLOAD_KEY_ALIAS="$AIS_UPLOAD_KEY_ALIAS" \
            -PAIS_UPLOAD_KEY_PASSWORD="$AIS_UPLOAD_KEY_PASSWORD"

      - name: Upload AAB to release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/bundle/release/*.aab
