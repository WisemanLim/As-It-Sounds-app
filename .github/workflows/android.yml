name: Android

# ─── DISABLED ─────────────────────────────────────────────────────────────
# Auto-triggers are commented out per Stage-2.5 hold. Only manual runs via
# the "Run workflow" button in Actions UI fire. Re-enable by uncommenting
# the push/pull_request blocks below.
# ──────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "android/**"
  #     - "core/**"
  #     - ".github/workflows/android.yml"
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - "android/**"
  #     - "core/**"

permissions:
  contents: read

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust + Android targets
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi \
                           x86_64-linux-android i686-linux-android
          cargo install --locked cargo-ndk

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018
            cmake;3.22.1

      - name: Export NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/**/libs.versions.toml') }}

      - name: Fetch whisper.cpp
        run: |
          test -d core/third_party/whisper.cpp || \
            git clone --depth 1 --branch v1.7.5 \
              https://github.com/ggerganov/whisper.cpp core/third_party/whisper.cpp

      - name: Build Rust core (.so × 4 ABIs) + Kotlin bindings
        run: |
          source "$HOME/.cargo/env"
          cd core && ./scripts/build-android.sh

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsItSounds-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
